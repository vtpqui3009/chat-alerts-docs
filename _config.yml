title: Chat Alerts for Jira
description: Jira updates in your Telegram and Lark group chats
lang: en
author: Mekong Apps
url: https://vtpqui3009.github.io
baseurl: /chat-alerts-docs

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - playwright.config.ts
  - node_modules
  - tests
  - test-results
  - playwright-report
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: doc
