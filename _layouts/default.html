<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1d4ed8">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip" href="#main">{% if page.lang == 'vi' %}Bỏ qua tới nội dung{% else %}Skip to content{% endif %}</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/favicon.svg' | relative_url }}" alt="" width="28" height="28">
        <span>Chat Alerts <span class="brand-dim">for Jira</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/setup/' | relative_url }}"{% if page.url == '/setup/' %} aria-current="page"{% endif %}>Setup</a>
        <a href="{{ '/huong-dan/' | relative_url }}" lang="vi"{% if page.url == '/huong-dan/' %} aria-current="page"{% endif %}>Tiếng Việt</a>
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p><strong>Chat Alerts for Jira</strong> · Made by Mekong Apps</p>
      <p class="footer-links">
        <a href="{{ '/setup/' | relative_url }}">Setup guide</a>
        <a href="{{ '/huong-dan/' | relative_url }}" lang="vi">Hướng dẫn</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a>
      </p>
    </div>
  </footer>
  {% if page.layout == 'doc' %}<script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
